name: CI

# "No merge to main without tests passing" — every job here is a required
# status check (configure branch protection on `main` to require them).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  contract:
    name: Contract (test + wasm build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test -p oracle-escrow
      - name: Install Stellar CLI
        # Building from source (cargo install) pulls in the CLI's optional
        # hardware-wallet support (dbus, then libudev/hidapi — each fix
        # revealed the next missing system lib) and takes 10+ minutes. The
        # prebuilt .deb sidesteps the whole class of problem and is fast.
        # Pinned to the version this project was built/tested against.
        run: |
          curl -LO https://github.com/stellar/stellar-cli/releases/download/v27.1.0/stellar-cli_27.1.0_amd64.deb
          sudo dpkg -i stellar-cli_27.1.0_amd64.deb || sudo apt-get install -f -y
      - name: Build contract to WASM (proves it actually compiles for deployment, not just cargo test)
        run: stellar contract build --package oracle-escrow

  backend:
    name: Backend (unit + integration tests)
    runs-on: ubuntu-latest
    # A hung integration test (server.test.js spawns real child processes)
    # once ran to GitHub's default 6-hour job timeout undetected. This caps
    # the blast radius; --test-timeout in package.json bounds individual
    # tests so a hang fails fast instead of reaching this ceiling at all.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm test
        working-directory: backend
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: backend

  app:
    name: Frontend (build + audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      # npm ci here (not npm install): the wallet-kit dependency tree pulls in
      # several native/optional modules (usb, secp256k1, utf-8-validate, etc.)
      # whose platform-conditional lockfile entries didn't stay in sync
      # between local generation and the Linux CI runner — npm ci enforces an
      # exact match and failed on it in practice; npm install tolerates it.
      - run: npm install --no-audit --no-fund
        working-directory: app
      - run: npm run build
        working-directory: app
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: app

  demo-agent:
    name: Demo scripts (syntax check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demo-agent/package-lock.json
      - run: npm ci
        working-directory: demo-agent
      - run: npm run check
        working-directory: demo-agent
      - name: Dependency audit (fails only on high/critical)
        run: npm audit --omit=dev --audit-level=high
        working-directory: demo-agent
